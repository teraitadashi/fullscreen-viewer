<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>時計</title><style>html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 30% 20%,#2c3f86,#0b0f24 70%);color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif}body{display:flex;align-items:center;justify-content:center}.w{text-align:center}#t{font-size:min(21vw,24vh);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:.02em}#d{font-size:min(5.5vw,5vh);opacity:.75;margin-top:.3em}p{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));margin:0;text-align:center;font-size:13px;opacity:.5}</style></head><body><div class="w"><div id="t"></div><div id="d"></div></div><p>右上を長押しすると閉じます</p><script>var W=["日","月","火","水","木","金","土"];function z(n){return(n<10?"0":"")+n}function u(){var n=new Date();document.getElementById("t").textContent=z(n.getHours())+":"+z(n.getMinutes())+":"+z(n.getSeconds());document.getElementById("d").textContent=(n.getMonth()+1)+"月"+n.getDate()+"日（"+W[n.getDay()]+"）"}u();setInterval(u,1000);</script></body></html>
