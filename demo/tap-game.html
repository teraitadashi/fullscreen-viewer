<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>タップゲーム</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#13202b;color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:110px;font-size:17px;line-height:1.5}#hud b{font-size:22px}#dot{position:fixed;width:72px;height:72px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffe27a,#ff8a00);box-shadow:0 6px 18px rgba(255,138,0,.5);display:none}#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(10,18,26,.88)}#ov h1{margin:0 0 8px;font-size:30px}#ov p{margin:0 0 20px;opacity:.85;line-height:1.6}#go{min-width:180px;min-height:54px;border:0;border-radius:27px;background:#ff8a00;color:#fff;font-size:20px;font-weight:700}</style></head><body><div id="hud">スコア <b id="s">0</b>　残り <b id="r">20</b>秒<br><small>ベスト <b id="b" style="font-size:inherit">0</b></small></div><button id="dot" aria-label="丸"></button><div id="ov"><h1>タップゲーム</h1><p>出てくる丸を、20秒でできるだけ多くタップ！<br>ベスト記録は保存されます。</p><button id="go">スタート</button></div><script>(function(){var s=0,left=20,timer=0,best=0;try{best=+(localStorage.getItem("best")||0)}catch(e){}var $=function(i){return document.getElementById(i)};$("b").textContent=best;function move(){var d=$("dot"),w=innerWidth-72,h=innerHeight-72,top=110;d.style.left=Math.round(Math.random()*w)+"px";d.style.top=Math.round(top+Math.random()*Math.max(1,h-top-20))+"px"}function end(){clearInterval(timer);$("dot").style.display="none";var msg="スコア "+s;if(s>best){best=s;try{localStorage.setItem("best",String(best))}catch(e){}msg+="　🎉 ベスト更新！"}$("b").textContent=best;$("ov").querySelector("h1").textContent=msg;$("ov").querySelector("p").innerHTML="ベスト記録は "+best+" です。";$("go").textContent="もう一度";$("ov").style.display="flex"}$("go").onclick=function(){s=0;left=20;$("s").textContent=0;$("r").textContent=20;$("ov").style.display="none";$("dot").style.display="block";move();timer=setInterval(function(){left--;$("r").textContent=left;if(left<=0)end()},1000)};$("dot").addEventListener("pointerdown",function(e){e.preventDefault();s++;$("s").textContent=s;move()});})();</script></body></html>
